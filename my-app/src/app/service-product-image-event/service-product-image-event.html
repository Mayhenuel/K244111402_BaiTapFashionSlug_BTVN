<p class="p">Product List</p>
<table border="1" class="table1"> 
    <tr> 
        <th>Ma San Pham</th> 
        <th>Ten San Pham</th> 
        <th>Gia San Pham</th> 
        <th>Picture</th> 
        <th>Details</th> 
    </tr> 
    <tbody *ngFor="let p of products"> 
        <tr> 
            <td>{{p.ProductId}}</td> 
            <td>{{p.ProductName}}</td> 
            <td>{{p.Price}}</td> 
            <td> 
                <img src="{{p.Image}}" width="100"> 
            </td> 
            <td> 
                <a style="cursor:pointer;" (click)="viewDetail(p)" title="Click here to view detail">Details</a> 
            </td> 
        </tr> 
    </tbody> 
</table>
