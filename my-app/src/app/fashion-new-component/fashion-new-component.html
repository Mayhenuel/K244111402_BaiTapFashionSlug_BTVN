<main class="fashion-form-page container py-5">
  <header class="mb-4">
    <p class="eyebrow mb-2">BỘ SƯU TẬP</p>
    <h1>Thêm Fashion mới</h1>
    <p class="text-secondary">IdF sẽ được hệ thống cấp tự động để đảm bảo không trùng lặp.</p>
  </header>

  @if (errMessage) {
    <div class="alert alert-danger" role="alert">{{ errMessage }}</div>
  }

  <section class="fashion-form-card">
    <div class="mb-3">
      <label for="style" class="form-label">Phong cách</label>
      <input
        type="text"
        class="form-control"
        name="style"
        id="style"
        placeholder="Ví dụ: Tối giản"
        [(ngModel)]="fashion.style">
    </div>
    <div class="mb-3">
      <label for="fashion_subject" class="form-label">Tên Fashion</label>
      <input
        type="text"
        class="form-control"
        name="fashion_subject"
        id="fashion_subject"
        placeholder="Nhập tên sản phẩm"
        [(ngModel)]="fashion.fashion_subject">
    </div>
    <div class="mb-3">
      <label for="fashion_detail" class="form-label">Mô tả chi tiết</label>
      <textarea
        class="form-control"
        name="fashion_detail"
        id="fashion_detail"
        rows="4"
        placeholder="Mô tả chất liệu, kiểu dáng..."
        [(ngModel)]="fashion.fashion_detail"></textarea>
    </div>
    <div class="mb-4">
      <label for="fashion_image" class="form-label">Hình ảnh</label>
      <input
        type="file"
        accept="image/*"
        class="form-control"
        name="fashion_image"
        id="fashion_image"
        (change)="onFileSelected($event, fashion)">
    </div>
    @if (fashion.fashion_image) {
      <img class="image-preview mb-4" [src]="fashion.getBase64String()" alt="Xem trước ảnh Fashion">
    }
    <button type="button" class="btn btn-dark rounded-pill px-4" (click)="postFashion()">
      Tạo Fashion
    </button>
  </section>

  @if (fashion.IdF !== null) {
    <section class="created-card mt-4">
      <span class="eyebrow">ĐÃ TẠO THÀNH CÔNG</span>
      <h2 class="h4 mt-2">{{ fashion.fashion_subject }}</h2>
      <p class="mb-1">IdF: <strong>{{ fashion.IdF }}</strong></p>
      <a [routerLink]="['/fashion', fashionSlug()]">{{ fashionSlug() }}</a>
    </section>
  }
</main>
