<div class="container mt-4" style="max-width: 500px; border: 1px solid #ddd; padding: 20px; border-radius: 8px;">
  <h2 class="text-center mb-4">Đăng ký khóa học</h2>
  <form #courseForm="ngForm" (ngSubmit)="onSubmit()">
    <!-- Tên: Bắt buộc (required) -->
    <div class="mb-3">
      <label class="form-label">Tên:</label>
      <input type="text" class="form-control" name="fullName"
             [(ngModel)]="courseModel.fullName"
             #name="ngModel" required
             [class.is-invalid]="name.invalid && name.touched"
             placeholder="Nhập tên">
      <!-- Thông báo lỗi cho Tên -->
      <small class="text-danger" [class.d-none]="name.valid || name.untouched">
        Bạn chưa nhập tên
      </small>
    </div>
    <!-- Email: Bắt buộc + Định dạng email -->
    <div class="mb-3">
      <label class="form-label">Email:</label>
      <input type="email" class="form-control" name="email"
             [(ngModel)]="courseModel.email"
             #email="ngModel" required email
             [class.is-invalid]="email.invalid && email.touched"
             placeholder="Nhập địa chỉ email">
      <!-- Lỗi chi tiết cho Email sử dụng *ngIf -->
      <div *ngIf="email.errors && (email.invalid || email.touched)">
        <small class="text-danger" *ngIf="email.errors['required']">Bạn chưa nhập email</small>
        <small class="text-danger" *ngIf="email.errors['email']">Email không hợp lệ</small>
      </div>
    </div>   

    <!-- Điện thoại: Bắt buộc + Chỉ cho phép nhập số -->
    <div class="mb-3">
      <label class="form-label">Điện thoại:</label>
      <input type="tel" class="form-control" name="phone"
             [(ngModel)]="courseModel.phone"
             #phone="ngModel" required pattern="[0-9]*"
             minlength="10"
             [class.is-invalid]="phone.invalid && phone.touched">
      <small class="text-danger" *ngIf="phone.invalid && phone.touched">
        Số điện thoại không hợp lệ (chỉ nhập số và có ít nhất 10 chữ số)
      </small>
    </div>
    <!-- Chọn khóa học: Bắt buộc chọn -->
    <div class="mb-3">
      <label class="form-label">Chọn khóa học:</label>
      <select class="form-select" name="course"
              [(ngModel)]="courseModel.course"
              #course="ngModel" required
              [class.is-invalid]="course.invalid && course.touched">
        <option value="">------------</option>
        <option value="angular">Angular căn bản</option>
        <option value="nodejs">Node.js nâng cao</option>
        <option value="datascience">Data Science</option>
      </select>
      <small class="text-danger" *ngIf="course.invalid && course.touched">
        Vui lòng chọn một khóa học
      </small>
    </div>   
    <!-- Chọn ca học -->
    <div class="mb-3">
      <label class="form-label me-3">Chọn ca học:</label>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="shift" id="sang" value="sang"
               [(ngModel)]="courseModel.shift">
        <label class="form-check-label" for="sang">Sáng</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="shift" id="toi" value="toi"
               [(ngModel)]="courseModel.shift">
        <label class="form-check-label" for="toi">Tối</label>
      </div>
    </div>

    <!-- Đồng ý điều khoản: Phải tích chọn (required) -->
    <div class="mb-3 form-check">
      <input type="checkbox" class="form-check-input" name="agree" id="checkTerms"
             [(ngModel)]="courseModel.agree"
             #agree="ngModel" required>
      <label class="form-check-label" for="checkTerms">Đồng ý với điều khoản</label>
      <div class="text-danger" *ngIf="agree.invalid && agree.touched">
        <small>Bạn phải đồng ý với điều khoản để tiếp tục</small>
      </div>
    </div>
    <!-- Nút Submit: Chỉ sáng lên khi TOÀN BỘ Form hợp lệ -->
    <button type="submit" class="btn btn-primary w-25" [disabled]="courseForm.invalid">Submit</button>
    <!-- Khu vực hiển thị Debug dữ liệu cho sinh viên xem (Tùy chọn) -->
    <hr>
    <div class="mt-3 p-2 bg-light border border-info rounded">
      <small class="text-primary"><b>Trạng thái Object hiện tại:</b></small>
      <pre class="mb-0" style="font-size: 11px;">{{ courseModel | json }}</pre>
    </div>
  </form>
</div>
