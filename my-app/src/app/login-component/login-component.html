<div class="container mt-5" style="max-width: 400px; border: 1px solid #ccc; padding: 30px; border-radius: 10px; background: #f9f9f9;">
  <h3 class="text-center mb-4">Đăng Nhập</h3>
  <form #loginForm="ngForm" (ngSubmit)="onLogin()">
    <!-- Tên đăng nhập -->
    <div class="mb-3">
      <label class="form-label">Tên đăng nhập:</label>
      <input type="text" class="form-control" name="username"
             [(ngModel)]="user.username" #username="ngModel"
             required minlength="4"
             [class.is-invalid]="username.invalid && username.touched">
      <div class="invalid-feedback">
        <small *ngIf="username.errors?.['required']">Vui lòng nhập tên đăng nhập.</small>
        <small *ngIf="username.errors?.['minlength']">Tên đăng nhập phải từ 4 ký tự.  
        </small>
      </div>
    </div>
    <!-- Mật khẩu -->
    <div class="mb-3">
      <label class="form-label">Mật khẩu:</label>
      <input type="password" class="form-control" name="password"
             [(ngModel)]="user.password" #password="ngModel"
             required
             [class.is-invalid]="password.invalid && password.touched">
      <div class="invalid-feedback">
        <small>Vui lòng nhập mật khẩu.</small>
      </div>
    </div>
    <!-- Lưu thông tin đăng nhập -->
    <div class="mb-3 form-check">
      <input type="checkbox" class="form-check-input" name="rememberMe"
             id="remember" [(ngModel)]="user.rememberMe">
      <label class="form-check-label" for="remember">Lưu thông tin đăng nhập</label>
    </div>
    <!-- Nút Đăng nhập: Chỉ sáng khi form.valid = true -->
    <button type="submit" class="btn btn-success w-100" [disabled]="loginForm.invalid">
      Đăng nhập
    </button>
  </form>
</div>
