{{errMessage()}}
<table border="1">
    <tr>
        <td>BookId</td>
        <td>BookName</td>
        <td>Price</td>
        <td>Image</td>
        <td>Action</td>
    </tr>
    <tbody>
      @for (book of books();track book.BookId){
        <tr>
            <td>{{book.BookId}}</td>
            <td>{{book.BookName}}</td>
            <td>{{book.Price}} </td>
            <td>
                <img src="{{server_images_link}}/{{book.Image}}" width="50px" height="50px">
            </td>
            <td>
                <button (click)="deleteBook(book.BookId)">Delete</button>
            </td>
        </tr>
      }@empty{
        <tr>
          <td colspan="5">Not found books</td>
        </tr>
      }
    </tbody>
</table>
