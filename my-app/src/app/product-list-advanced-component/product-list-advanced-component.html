<p>product-list-advanced-component works!</p>
{{errMessage()}}
<table border="1">
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Price</th>
      <th>Image</th>
      <th>Details</th>
      <th>Slug</th>
    </tr>
  </thead>
    <tbody>
    @for (p of products(); track p.id) {
    <tr>
      <td>{{ p.id }}</td>

        <td>
          <a routerLink="/products/{{ p.id }}" target="_blank">
            {{ p.name }}
          </a>
        </td>

        <td>{{ p.price }}</td>

        <td>
          <a routerLink="/products/{{ p.id }}" target="_blank">
            <img
              [src]="p.image"
              [alt]="p.name"
              width="100"
            >
          </a>
        </td>
      <td>
        <a routerLink="/products/{{p.id}}" target="_blank"
        title="click here to view detail">
          View detail</a>
      </td>
      <td>
        <a target="_blank"
        (click)="viewDetailSlug(p)"
        style="cursor: pointer;"
        title="click here to view detail" >
        {{generateSlug(p.name,p.id)}}
      </a>
      </td>
    </tr>
  } @empty {
    <tr>
      <td colspan="3">No products available.</td>
    </tr>
  }
  </tbody>
</table>
<router-outlet></router-outlet>
